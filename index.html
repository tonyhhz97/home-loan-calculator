<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Integrated Home Loan Calculator</title>
  <meta name="description" content="An interactive property loan, upfront cost, rebate and rental ROI calculator.">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Keeps the stacked "Comparison" / "DSR Calculation" buttons full-width
       and in their own row on mobile, matching how the single button used
       to behave (see .hero-frame .comparison-btn in styles.css). Scoped
       here rather than in the shared stylesheet since it only concerns
       this page's topbar-actions wrapper. */
    @media (max-width:600px){
      .hero-frame .comparison-btn{text-align:center;}
      .hero-frame .topbar-actions{order:3; width:100%;}
    }
  </style>
</head>
<body>
  <!-- Fixed full-screen photo background — lives outside #app so app.js's
       re-renders (on every field edit) never recreate it, which would
       otherwise restart the zoom animation on every keystroke. It stays
       pinned to the viewport while the page scrolls, and is only ever
       hidden behind the opaque calculator cards. -->
  <div class="page-bg" aria-hidden="true">
    <div class="page-bg-image"></div>
    <div class="page-bg-overlay"></div>
  </div>

  <div class="app" id="app">
    <!-- rendered by app.js -->
  </div>

  <script src="config.js"></script>
  <script src="calculations.js"></script>
  <script src="app.js"></script>
</body>
</html>
